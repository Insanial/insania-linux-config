# 终端字体设为 0xProto Nerd Font Mono
font_family 0xProto Nerd Font Mono
# Nerd Fonts 符号映射
# symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols
# 字体大小（单位：像素）
font_size 14.0

# 窗口边距（单位：像素，四周留白）
window_padding_width 4

# 启用的分屏布局：纵向（tall）、宽胖（fat）、网格（grid）、堆叠（stack）
enabled_layouts tall,fat,grid,stack

# 标签栏风格使用 powerline 样式
tab_bar_style powerline

# 背景透明度，0~1
background_opacity 0.95

# --------------------------------光标配置
# block, beam, underline
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor #ff0000
cursor_text_color #ffffff

# --------------------------------滚动配置
scrollback_lines 100000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS
wheel_scroll_multiplier 5.0

# --------------------------------鼠标配置
mouse_hide_wait 3.0
url_color #0087bd
url_style curly
# kitty_mod ctrl+shift
# open_url_with kitty_mod
copy_on_select no

# --------------------------------性能调优
repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell no

# --------------------------------窗口布局配置
enabled_layouts tall,fat,grid,splits,stack
window_border_width 1
window_margin_width 0
window_padding_width 4
active_border_color #00ff00
inactive_border_color #cccccc

# --------------------------------标签页栏配置
tab_bar_style powerline
tab_bar_align left
tab_title_template "{index}: {title}"

# --------------------------------颜色配置
foreground #a9b1d6
background #1a1b26
selection_foreground #1a1b26
selection_background #a9b1d6
cursor #a9b1d6

# 16色调色板
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# 背景透明
background_opacity 0.95
dynamic_background_opacity yes

# --------------------------------高级配置
# 环境变量
env PATH=${HOME}/bin:${PATH}

# Shell
shell /bin/bash
shell_integration enabled

# 远程控制
allow_remote_control yes
listen_on unix:/tmp/kitty

# 启动会话
startup_session none

# 关闭窗口确认
confirm_os_window_close 0

# 自动更新检查
update_check_interval 24

# 剪贴板安全
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Linux 输入法
linux_display_server auto

# Wayland
wayland_titlebar_color system

# 通知
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "🔔 "
command_on_bell none

# --------------------------------
